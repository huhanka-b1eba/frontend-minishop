<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <section>
            <h1>Каталог товаров</h1>
            <p class="description">
                Найдите нужный товар или загрузите весь каталог интернет-магазина.
            </p>

            <div class="controls">
                <label for="search">Поиск по каталогу</label>
                <input
                    type="search"
                    id="search"
                    placeholder="Введите название товара"
                >
                <button type="button" id="search-btn">Найти</button>
                <button type="button" id="add-btn">Добавить товар</button>
            </div>

            <p id="message" aria-live="polite"></p>
            <div id="products" class="products">
                <article class="product-card">
                    <img
                        class="product-image"
                        src="https://cdn.dummyjson.com/product-images/motorcycle/300-touring/thumbnail.webp"
                        alt="Мотоцикл 300 Touring"
                    >
                    <h2 class="product-title">300 Touring</h2>
                    <p class="product-price">$28,999.99</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
